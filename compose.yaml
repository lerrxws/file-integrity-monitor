services:
  monitor:
    build: ./fim
    image: file-integrity-monitor:local
    env_file: .env
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./web/public
        target: /app/web/public
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./fim/data
        target: /app/fim/data
        read_only: true
        bind:
          create_host_path: false
      - logs:/app/fim/logs
      - ./fim/config/config.json:/app/fim/config/config.json:ro

  web:
    build: ./web
    image: file-integrity-web:local
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:80"
    volumes:
      - type: bind
        source: ./web/public
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false

volumes:
  logs:
